[project]
name = "demo-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "colorama>=0.4.6",
    "setup-tools>=65.0.0",
    "ctx>=0.0.2",
    "loglib-python>=0.1.0",
    "noblesse>=1.0.0",
    "pyquest>=0.1.0",
    "discordpy-self>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.poetry]
name = "demo-app"
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.0"
alembic = "^1.11.0"
